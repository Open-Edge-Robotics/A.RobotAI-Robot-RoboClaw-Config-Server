server:
  host: 0.0.0.0
  port: 8080
log:
  level: info
database:
  path: ai-config-server.db
security:
  # 토큰을 파일에 쓰지 않는다. 환경변수 또는 Secret Manager로 주입한다.
  #   AI_CONFIG_SERVER_SECURITY_ADMIN_TOKEN=<admin token>
  #   AI_CONFIG_SERVER_SECURITY_DEVICE_TOKEN=<device token>
  # (쿠버네티스 배포 시 kube/secret.yaml의 값을 env로 주입함)
  admin_token: ""
  device_token: ""
  require_auth: true
  cors_allowed_origins:
    - "http://192.168.50.30:8080"
    - "http://192.168.50.30"
    - "http://localhost:8080"
    - "http://localhost"
    - "http://127.0.0.1:8080"
    - "http://127.0.0.1"
mcp:
  # MCP 서버 카탈로그(찾아보기) 조회 시 우선 시도할 레지스트리 URL.
  # 비워두면 내장 큐레이티드 카탈로그만 사용한다.
  # 설정 시에도 조회 실패하면 내장 카탈로그로 자동 폴백한다.
  # 예: https://registry.modelcontextprotocol.io
  registry_url: ""
