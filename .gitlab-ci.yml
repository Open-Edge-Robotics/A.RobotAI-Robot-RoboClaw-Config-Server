# GitLab CI for ai-config-server
#
# 스테이지: test → build
# - backend  : Go vet / gofmt / 단위 테스트 / 바이너리 빌드
# - frontend : Flutter analyze / 단위 테스트 / Web 빌드
#
# 참고:
# - SQLite CGO 컴파일을 위해 Go 이미지에 build-base(gcc) 를 설치한다.

stages:
  - test
  - build

variables:
  # Go 빌드 캐시를 CI 캐시로 재사용
  GOPATH: /go
  GOCACHE: /go/.cache/go-build
  GOMODCACHE: /go/pkg/mod
  # Flutter pub 캐시를 프로젝트 내로 고정해 CI 캐시로 재사용
  PUB_CACHE: $CI_PROJECT_DIR/.pub-cache

# ===== Test =====

backend-test:
  stage: test
  image: golang:1.26-alpine
  before_script:
    - apk add --no-cache build-base git
  script:
    # 추적 파일에 시크릿/개인정보가 들어가지 않았는지 검사
    - go run . secret-scan
    # Contract 및 Schema Lock 무결성 검증
    - go run . contract check
    # 포맷 위반이 있으면 실패 (gofmt -l 은 출력이 있어도 exit 0 이므로 test -z 로 검사)
    - test -z "$(gofmt -l cmd/ config/ database/ handler/ internal/ main.go testutil/)"
    - go vet ./...
    - go test ./...
  cache:
    key:
      files:
        - go.sum
    paths:
      - /go/pkg/mod
      - /go/.cache/go-build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

frontend-test:
  stage: test
  image: ghcr.io/cirruslabs/flutter:stable
  script:
    - cd frontend
    - flutter pub get
    - dart format --output=none --set-exit-if-changed lib test
    - flutter analyze
    - flutter test --coverage
    # 커버리지 게이트 (기준선 80%). 핵심 Controller/API/모델은 100% 수준이며,
    # 화면/위젯 테스트가 늘어나면 임계치를 점진적으로 상향한다. (docs/testing.md 참고)
    - |
      awk -F: '/^LF:/{lf+=$2}/^LH:/{lh+=$2}END{printf "coverage: %.1f%%\n",100*lh/lf; if (100*lh/lf < 80) exit 1}' coverage/lcov.info
  artifacts:
    when: always
    paths:
      - frontend/coverage/lcov.info
    expire_in: 1 week
  cache:
    key:
      files:
        - frontend/pubspec.lock
    paths:
      - .pub-cache/
      - frontend/.dart_tool/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ===== Build =====

backend-build:
  stage: build
  image: golang:1.26-alpine
  before_script:
    - apk add --no-cache build-base git
  script:
    - CGO_ENABLED=1 go build -o aics .
  artifacts:
    paths:
      - aics
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

frontend-build:
  stage: build
  image: ghcr.io/cirruslabs/flutter:stable
  script:
    - cd frontend
    - flutter pub get
    - flutter build web --base-href "/web/" --release
  artifacts:
    paths:
      - frontend/build/web
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
